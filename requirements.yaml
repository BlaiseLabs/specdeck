# What specdeck must be true of itself. Written by hand; the tests are the
# evidence. `specdeck validate` lints this file; `specdeck requirements` reports
# which entries are met.
requirements:
- id: spec.generated
  says: The spec is generated from the tests, so it cannot drift from them.
  why: >-
    Every other arrangement — a .feature file, a hand-written spec — needs someone
    to keep two things in step, and nobody does. If the spec is output, there is
    nothing to keep in step.

- id: spec.valid
  says: A generated spec has no validation errors or warnings.
  why: >-
    A document that is merely usually well-formed cannot be a contract. specdeck
    validates its own output rather than depending on another project to do it.

- id: spec.narrates-unrun
  says: Scenarios that were skipped or failed early still read as prose.
  why: >-
    A tests-first suite is mostly red. If the spec only narrated what executed, it
    would be useless exactly when it is most wanted — before the code exists.

- id: spec.safe-yaml
  says: Step text containing a colon never produces an unparseable spec.
  why: >-
    Unquoted `key: value` inside a scalar silently broke the hand-written specs
    this replaces; two files were unloadable for months before anyone noticed.

- id: deps.document-only
  says: A dependency orders reading and reporting, never test execution.
  why: >-
    Tests that must run in order are an anti-pattern — they cannot be run alone or
    in parallel, and they pass for the wrong reasons. The graph is for readers.

- id: deps.resolvable
  says: Every depends_on in a generated spec names a scenario that exists.
  why: >-
    A dangling reference is an error in the format, and silently emitting one
    makes the graph lie about what blocks what.

- id: gate.optional
  says: Adding specdeck to a suite never changes its exit code unless a gate is switched on.
  why: >-
    A tool that fails other people's builds on arrival gets uninstalled. Gates are
    opt-in, by flag or config.

- id: gate.enforceable
  says: An unmet requirement or an unknown covers= id can fail the run.
  why: >-
    Traceability that can only warn is decorative. For the link to mean anything,
    CI has to be able to refuse.

- id: run.partial-safe
  says: A partial run never silently shrinks the spec.
  why: >-
    `-k` collects a subset; rewriting the spec from it would delete every scenario
    that did not run. The default refuses, and --specdeck-merge updates in place.
- id: trust.proven-not-passing
  says: A met requirement whose covering tests ran a changed line without noticing it changed is reported as unproven, not as done.
  why: Passing is not proving. proofdeck knows what a test noticed; specdeck knows what the test is for; only the join says both.
- id: report.pr-comment
  says: One run's result is one Markdown document a pull-request comment can carry, with fix-first, blocked, requirements and proof.
- id: context.states-the-rule
  says: The agent document states that a prerequisite only blocks a scenario that runs after it.
  why: >-
    Measured: without this sentence every reader, model or human, applies the obvious
    rule — "anything upstream failed means blocked" — and sorts failures from blocked
    at 40% exact instead of 100%. It costs about 100 tokens.
- id: context.names-the-code
  says: The agent document maps source functions to the scenarios that execute them.
  why: >-
    Measured: the spec alone could not say which tests a changed line affects (0.80 F1
    against 0.93 for the raw test files, 25 real failures missed). With the map that
    falls to 4 missed, for fewer tokens than the test files cost.
- id: context.hubs-are-not-evidence
  says: A function that most of the suite runs is reported as a count, not as a list of scenarios.
  why: >-
    Measured: the list for one such function (47 of 88 scenarios) made an agent name 87
    tests as failing when the answer was none; the same agent without the map named 9. The
    list is identical for every change in that function, so it is noise shaped like evidence.
- id: context.scales-to-a-diff
  says: The agent document can be written for the files a change touches, keeping unrelated scenarios in brief.
  why: >-
    On a large suite most scenarios are irrelevant to a given diff. Trimming them to id,
    name, dependencies and node id cuts the document to roughly a third for a change in a
    leaf module, while keeping the dependency graph whole.
- id: context.states-the-why
  says: The agent document carries each requirement's says and why, with the tests linked to it, and a profile that sends only that.
  why: >-
    What a test is for is not in the tests. With comments and docs stripped, an agent given
    the spec without the requirements scored 6/10 on why tests exist: it saw requirement ids
    as tags but never what they said or why, and the 23k-token document left no budget to
    go and find requirements.yaml.
- id: context.strategies
  says: The agent context comes in named strategies, each stating what it carries and what that measured.
  why: >-
    No arrangement measured is best at both questions: the dependency rule that takes
    root-cause sorting from 40% to 100% costs 'which tests break' accuracy, in the generated
    document and in the raw test files alike. Choosing is unavoidable, so the choice is named
    and its numbers published rather than buried.

- id: req.attributes
  statement: >-
    Each requirement shall carry the attributes of ISO/IEC/IEEE 29148:2018 §5.2.8 under the
    standard's names, with its type from §5.2.8.3 and its verification method from §6.5.2.
  rationale: >-
    What a requirement records about itself — why it exists, how much it matters, who owns it,
    how it is verified — is what makes a specification usable. Under the standard's names, a
    reader who knows 29148 needs no translation, and a specdeck requirement is a requirement in
    the sense every requirements engineer uses.
  type: functional
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §5.2.8

- id: req.quality
  statement: >-
    `specdeck validate` shall report each requirement and requirement set that departs from the
    quality criteria of ISO/IEC/IEEE 29148:2018 that a tool can check, citing the clause.
  rationale: >-
    The standard defines what makes a requirement good (§5.2.4 construct, §5.2.5 individual
    characteristics, §5.2.6 set characteristics, §5.2.7 language). Checking them where a machine
    can, and naming the clause, turns a 100-page standard into feedback on the line someone just
    wrote. The criteria that need judgement (appropriate, feasible, correct) are left to people.
  type: functional
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §5.2.4–5.2.7

- id: req.srs
  statement: >-
    `specdeck srs` shall produce the software requirements specification with the content of
    ISO/IEC/IEEE 29148:2018 §9.6, in the standard's order, verified from the last test run.
  rationale: >-
    The standard defines what a software requirements specification contains. Generating it from
    the requirements and the tests that verify them gives a document a reviewer or auditor
    recognises, that reports which requirements are verified now, and that cannot drift. Sections
    only people can write are marked to be supplied, so an incomplete set is visible (§5.2.6).
  type: functional
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §9.6
