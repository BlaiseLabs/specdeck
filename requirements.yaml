# specdeck's own requirements, in the form of ISO/IEC/IEEE 29148:2018: each a uniquely identified
# statement (§5.2.4) with the attributes of §5.2.8 and a verification method (§6.5.2). Written by
# hand; the tests are the evidence. `specdeck validate` checks this file against §5.2.4–5.2.7,
# `specdeck requirements` reports which entries are met, `specdeck srs` writes the specification.

# The sections of the specification only people can write (§9.6.2–9.6.9, §9.6.20).
srs:
  title: specdeck — software requirements specification
  purpose: >-
    specdeck makes a pytest suite its own requirements specification. Requirements are written
    once, with their rationale; tests are linked to the requirements they verify; and the
    specification is generated from every run, so it reports which requirements are verified now
    and cannot drift from the tests.
  scope: >-
    specdeck is a pytest plugin and command-line tool. It generates the scenario spec from a test
    run, reads and checks a requirements file, joins the two into verification status, writes
    documents for people (the specification, a pull-request report) and for coding agents, and
    serves a local viewer with run history. It does not run tests itself beyond invoking pytest,
    and it does not carry out the life-cycle processes of ISO/IEC/IEEE 29148 Clause 6.
  product_perspective: >-
    specdeck runs inside pytest as a plugin and reads only what pytest and the project provide.
    proofdeck, a separate tool, supplies the mutation evidence that `specdeck trust` joins with
    the requirements to separate proven requirements from passing ones.
  user_characteristics: >-
    Python developers and QA engineers who write pytest suites, reviewers who read pull requests,
    and coding agents that work in the repository. No knowledge of the standard is assumed; its
    terms are used and cited where they apply.
  limitations: >-
    Verification by test is automated; inspection, analysis or simulation, and demonstration are
    recorded as declared on each requirement, not carried out. The quality checks cover the
    criteria of §5.2.4–5.2.7 a tool can check; appropriate, feasible and correct need review.
  assumptions: >-
    Python 3.10 or later and pytest. The viewer needs a local browser; coverage mapping needs
    coverage.py.
  apportioning: >-
    specdeck owns the requirements, their traceability to tests, the generated documents and the
    viewer. proofdeck owns mutation evidence: which tests notice a changed line.

requirements:

# --- the generated spec ------------------------------------------------------------------------

- id: spec.generated
  statement: The scenario spec shall be generated from the test suite on each run.
  rationale: >-
    Every other arrangement — a .feature file, a hand-written spec — needs someone to keep two
    things in step, and nobody does. If the spec is output, there is nothing to keep in step.
  type: functional
  verification: test

- id: spec.valid
  statement: A generated spec shall pass `specdeck validate` with no errors or warnings.
  rationale: >-
    A document that is merely usually well-formed cannot be a contract. specdeck validates its own
    output rather than depending on another project to do it.
  type: functional
  verification: test

- id: spec.narrates-unrun
  statement: A skipped or early-failing scenario shall still be narrated as prose in the spec.
  rationale: >-
    A tests-first suite is mostly red. If the spec only narrated what executed, the spec would be
    useless exactly when a reader wants it — before the code exists.
  type: functional
  verification: test

- id: spec.safe-yaml
  statement: Step text containing a colon shall produce a spec that parses.
  rationale: >-
    Unquoted `key: value` inside a scalar silently broke the hand-written specs specdeck replaces;
    two files were unloadable for months before anyone noticed.
  type: software-attribute
  verification: test

- id: spec.names
  statement: A scenario's name shall be the first sentence of its test's docstring.
  rationale: >-
    Docstrings are wrapped at a line length, not at a thought. A name cut at the first line stops
    mid-sentence and reads as a mistake in every report that shows it.
  type: functional
  verification: test

- id: spec.failure-detail
  statement: A failing Then step shall record the expected value, the observed value and the decision context.
  rationale: >-
    A failure that says only "assert failed" sends the reader to the code. The expected and
    observed values, with the decision the step was checking, say what went wrong in place.
  type: functional
  verification: test

- id: spec.opt-out
  statement: A run with `--no-specdeck` shall write no spec.
  rationale: >-
    Some runs are not meant to be recorded (a debugging loop, a CI job that only gates). Turning
    the plugin off for one run has to leave the files as they were.
  type: functional
  verification: test

- id: spec.parametrized-ids
  statement: A scenario id on a parametrized test shall give one scenario per case.
  rationale: >-
    A parametrized test is several scenarios that share code. Giving the cases one id would merge
    their outcomes, hiding a failing case behind a passing one.
  type: functional
  verification: test

- id: spec.parametrized-deps
  statement: A dependency on the id of a parametrized scenario shall be a dependency on each of its cases.
  rationale: >-
    Depending on a parametrized scenario means depending on what the scenario checks, in each
    case. Waiting for one case only would report a dependant as runnable while a case it needs
    fails.
  type: functional
  verification: test

- id: spec.step-text
  statement: Step text written as an f-string shall be filled in from each case's parameters, in skipped cases too.
  rationale: >-
    A parametrized scenario reads as one case per row only if each row says its own values. A
    skipped case still needs its values filled in, or the narrated spec shows placeholders.
  type: functional
  verification: test

# --- dependencies and analysis -----------------------------------------------------------------

- id: deps.document-only
  statement: A dependency shall order reading and reporting, and not test execution.
  rationale: >-
    Tests that must run in order are an anti-pattern: they cannot run alone or in parallel, and
    they pass for the wrong reasons. The graph is for readers.
  type: design-constraint
  verification: test

- id: deps.resolvable
  statement: Each depends_on in a generated spec shall name a scenario in that spec.
  rationale: >-
    A dangling reference is an error in the format, and silently emitting one makes the graph
    misreport what blocks what.
  type: functional
  verification: test

- id: analysis.root-causes
  statement: The viewer shall list the root-cause failures, ordered by the number of scenarios each one blocks.
  rationale: >-
    A failing scenario whose prerequisite also fails is a symptom, not a place to start. Listing
    the root causes, biggest blocker first, tells a developer what to fix first.
  type: functional
  verification: test

- id: analysis.load-bearing
  statement: The viewer shall rank scenarios by the number of scenarios that depend on each one, directly or transitively.
  rationale: >-
    A scenario many others depend on is where a regression costs the most. Ranking by dependants
    shows where tests matter before anything fails.
  type: functional
  verification: test

- id: analysis.goals
  statement: The viewer shall show each goal, a scenario no other depends on, with progress over the goal and its prerequisites.
  rationale: >-
    The ends of the dependency graph are what the suite is for. Progress toward each one, counting
    its prerequisites, is the honest measure of how close a feature is to done.
  type: functional
  verification: test

# --- gates and runs ----------------------------------------------------------------------------

- id: gate.optional
  statement: Adding specdeck to a suite shall leave its exit code unchanged until a gate is switched on.
  rationale: >-
    A tool that fails other people's builds on arrival gets uninstalled. Gates are opt-in, by flag
    or config.
  type: design-constraint
  verification: test

- id: gate.enforceable
  statement: A run with a gate switched on shall fail on an unmet requirement or an unknown covers= id.
  rationale: >-
    Traceability that can only warn is decorative. For the link to mean something, CI has to be
    able to refuse.
  type: functional
  verification: test

- id: run.partial-safe
  statement: A partial run shall keep the scenarios outside the run in the spec.
  rationale: >-
    `-k` collects a subset; rewriting the spec from it would delete every scenario that did not
    run. The default refuses, and --specdeck-merge updates in place.
  type: software-attribute
  verification: test

# --- requirements ------------------------------------------------------------------------------

- id: req.attributes
  statement: >-
    Each requirement shall carry the attributes of ISO/IEC/IEEE 29148:2018 §5.2.8 under the
    standard's names, with its type from §5.2.8.3 and its verification method from §6.5.2.
  rationale: >-
    What a requirement records about itself — why it exists, how much it matters, who owns it,
    how it is verified — is what makes a specification usable. Under the standard's names, a
    reader who knows 29148 needs no translation, and a specdeck requirement is a requirement in
    the sense every requirements engineer uses.
  type: standards-compliance
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §5.2.8

- id: req.verification-status
  statement: Each run shall report each requirement as met, failing, blocked, not run or untested from the tests that verify the requirement.
  rationale: >-
    A requirement is verified by objective evidence. The tests linked to a requirement are that
    evidence, and their last outcome is the requirement's verification status — written on every
    run, whatever pytest plugins are loaded.
  type: functional
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §6.5.2

- id: req.summary
  statement: Each run shall print a one-line requirements summary naming the failing and blocked requirements.
  rationale: >-
    The summary is often all a person or an agent reads of a run. "1 failing" sends the reader to
    a report to find out which; naming it says which rule broke where the reader already is. A
    requirement verified by inspection or demonstration (§6.5.2) is counted apart, not as untested.
  type: interface
  verification: test

- id: req.examples
  statement: A test shall take its expected value from a requirement's example through `example()`, with each use recorded.
  rationale: >-
    An expected value copied from what the code printed passes even when the code is wrong. Taken
    from the requirement, the value comes from the need, and the record shows which examples were
    checked. Examples make a requirement verifiable (§5.2.5).
  type: functional
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §5.2.5

- id: req.unknown-example
  statement: A call to `example()` with inputs the requirement has no example for shall fail with the examples the requirement has.
  rationale: >-
    A mistyped input would otherwise look like a missing value. Failing with the available
    examples shows the reader what the requirement does specify.
  type: functional
  verification: test

- id: req.malformed-entry
  statement: A malformed requirements entry shall be reported and skipped, with the rest of the file used.
  rationale: >-
    One bad entry should not cost a team its whole traceability report. The problem is named, and
    the other requirements are still verified.
  type: software-attribute
  verification: test

- id: req.quality
  statement: >-
    `specdeck validate` shall report each requirement and requirement set that departs from the
    quality criteria of ISO/IEC/IEEE 29148:2018 that a tool can check, citing the clause.
  rationale: >-
    The standard defines what makes a requirement good (§5.2.4 construct, §5.2.5 individual
    characteristics, §5.2.6 set characteristics, §5.2.7 language). Checking them where a machine
    can, and naming the clause, turns a 100-page standard into feedback on the line someone just
    wrote. The criteria that need judgement (appropriate, feasible, correct) are left to people.
  type: standards-compliance
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §5.2.4–5.2.7

- id: req.consistent-examples
  statement: "`specdeck validate` shall report a requirement whose examples give two expected values for the same inputs."
  rationale: >-
    A set is consistent when no requirement contradicts another (§5.2.6). A requirement that gives
    two answers for one input contradicts itself, and any test checked against it passes or fails
    by which example it picked.
  type: standards-compliance
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §5.2.6

- id: req.consistent-tests
  statement: >-
    `specdeck validate` shall report a linked test that asserts a literal value for an example's
    inputs that differs from the example's expected value, with the test's file and line.
  rationale: >-
    A test written with a number instead of `example()` can drift from the requirement it claims
    to verify. Then the test and the requirement disagree and cannot both be right (§5.2.6). The
    report names the place, because one of the two has to change.
  type: standards-compliance
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §5.2.6

- id: req.file-validation
  statement: >-
    `specdeck validate` shall report problems in the requirements file in the form of spec
    problems, failing on a file that cannot be read.
  rationale: >-
    One command, one report shape, for the spec and the requirements. A file that cannot be read
    is not a warning: bad indentation once turned a nine-entry file into "no requirements".
  type: functional
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §5.2.5

- id: req.srs
  statement: >-
    `specdeck srs` shall produce the software requirements specification with the content of
    ISO/IEC/IEEE 29148:2018 §9.6, in the standard's order, verified from the last test run.
  rationale: >-
    The standard defines what a software requirements specification contains. Generating the
    specification from the requirements and the tests that verify them gives a document a reviewer
    or auditor recognises, that reports which requirements are verified now, and that cannot drift.
    Sections only people can write are marked to be supplied, so an incomplete set is visible.
  type: standards-compliance
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §9.6

# --- proof and reports -------------------------------------------------------------------------

- id: trust.proven-not-passing
  statement: >-
    A met requirement whose verifying tests ran a changed line without noticing a mutation of the
    line shall be reported as unproven.
  rationale: >-
    Passing is not proving. proofdeck knows what a test noticed; specdeck knows what the test is
    for; only the join says both.
  type: functional
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §6.5.2

- id: report.pr-comment
  statement: >-
    Each run shall produce one Markdown report sized for a pull-request comment, with what to fix
    first, what is blocked, the requirements and their proof.
  rationale: >-
    Reviewers decide in the pull request, not on a dashboard. The result has to arrive where the
    decision is made, in one comment.
  type: interface
  verification: test

# --- documents for coding agents ---------------------------------------------------------------

- id: context.from-last-run
  statement: "`specdeck context` shall build the agent document from the files the last run left in .specdeck/."
  rationale: >-
    The document has to describe the suite as the last run saw it. Reading what the run wrote
    keeps the document and the run in step, and a missing spec is a usage error, not a crash.
  type: functional
  verification: test

- id: cli.missing-input
  statement: A command given an input file that does not exist shall exit with status 2 and name the file.
  rationale: >-
    A traceback for a mistyped path reads as a bug in the tool. Exit status 2 is the usage-error
    convention scripts and CI already understand.
  type: interface
  verification: test

- id: context.states-the-rule
  statement: The agent document shall state that a prerequisite blocks only the scenarios that run after the prerequisite.
  rationale: >-
    Measured: without this sentence every reader, model or human, applies the obvious rule —
    "anything upstream failed means blocked" — and sorts failures from blocked at 40% exact
    instead of 100%. The sentence costs about 100 tokens.
  type: functional
  verification: test

- id: context.names-the-code
  statement: The agent document shall map each source function to the scenarios that execute the function.
  rationale: >-
    Measured: the spec alone could not say which tests a changed line affects (0.80 F1 against
    0.93 for the raw test files, 25 real failures missed). With the map that falls to 4 missed,
    for fewer tokens than the test files cost.
  type: functional
  verification: test

- id: context.hubs-are-not-evidence
  statement: A function run by the majority of the suite shall be reported as a count of scenarios rather than a list.
  rationale: >-
    Measured: the list for one such function (47 of 88 scenarios) made an agent name 87 tests as
    failing when the answer was none; the same agent without the map named 9. The list is
    identical for every change in that function, so the list is noise shaped like evidence.
  type: functional
  verification: test

- id: context.scales-to-a-diff
  statement: The agent document shall be writable for the files a change touches, with unrelated scenarios in brief.
  rationale: >-
    On a large suite the bulk of the scenarios are unrelated to a given diff. Trimming them to
    id, name, dependencies and node id cuts the document to roughly a third for a change in a leaf
    module, while keeping the dependency graph whole.
  type: performance
  verification: test

- id: context.states-the-why
  statement: The agent document shall carry each requirement's statement and rationale with the tests that verify the requirement.
  rationale: >-
    What a test is for is not in the tests. With comments and docs stripped, an agent given the
    spec without the requirements scored 6/10 on why tests exist; with them, 29/30.
  type: functional
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §5.2.8

- id: context.strategies
  statement: The agent context shall come in named strategies, each stating its contents and its measured results.
  rationale: >-
    No arrangement measured is best at both questions: the dependency rule that takes root-cause
    sorting from 40% to 100% costs 'which tests break' accuracy, in the generated document and in
    the raw test files alike. Choosing is unavoidable, so the choice is named and its numbers
    published rather than buried.
  type: functional
  verification: test

- id: context.coverage-opt-in
  statement: Coverage mapping shall run only when requested by flag or config.
  rationale: >-
    Tracing slows a run down. A plain run has to cost what pytest costs, so the map is recorded
    only when someone asks for the map.
  type: performance
  verification: test

- id: context.coverage-unavailable
  statement: When coverage cannot be recorded, the run shall continue and report that the map is missing.
  rationale: >-
    Asking for a map and silently getting none is the worst outcome: the agent document would be
    missing its most useful half with no sign of the gap. The tests still run.
  type: software-attribute
  verification: test

- id: agents.rules
  statement: >-
    `specdeck agents` shall write each design-constraint, standards-compliance and process
    requirement into the agent instructions file with its rationale, the tests that verify the
    requirement and its verification status.
  rationale: >-
    An instructions file is mostly rules, and a hand-written one goes stale without anyone being
    told. Kept as typed requirements (§9.6.16, §9.6.17, §5.2.8.3), the rules carry their reasons
    and are checked by tests, so the file says which rules hold now and which are broken.
    Measured (bench/rules_ab): agents under pressure got around a rule test instead of keeping the
    rule, until the file said that doing so breaks the rule.
  type: functional
  verification: test

- id: agents.adherence
  statement: >-
    `specdeck agents` shall write the adherence policy above the rules, using specdeck's default
    clauses as changed by the `adherence:` block of requirements.yaml.
  rationale: >-
    What keeping a rule means is not in the rules; it is the policy part of the adherence system
    (rules, checks, policy, status). Measured (bench/rules_ab): agents under pressure got a rule's
    test to pass without keeping the rule until the policy said that this breaks the rule. The
    wording is a project's choice, so it is data with a default, not text in the code.
  type: functional
  verification: test

- id: agents.targets
  statement: >-
    `specdeck agents` shall write the generated block into each of CLAUDE.md and AGENTS.md that
    exists, or into a new AGENTS.md when neither does, unless `--out` names the files.
  rationale: >-
    The block only helps if the agent reads it. Claude Code reads CLAUDE.md, and AGENTS.md only
    when there is no CLAUDE.md; Codex, Cursor and Copilot read AGENTS.md. Writing to AGENTS.md
    alone left the rules invisible to Claude Code in every repo that also had a CLAUDE.md.
  type: functional
  verification: test

- id: agents.in-place
  statement: "`specdeck agents` shall replace only the generated block of an existing instructions file."
  rationale: >-
    AGENTS.md is usually written by hand. Generated rules have to share the file with the
    instructions people wrote, without overwriting them.
  type: functional
  verification: test

# --- run history and the viewer ----------------------------------------------------------------

- id: history.opt-in
  statement: Runs shall be recorded only with the live flag or its config setting.
  rationale: >-
    History is written to the user's home directory. Recording without being asked would leave
    files behind for people who never wanted the viewer.
  type: design-constraint
  verification: test

- id: history.record
  statement: >-
    Each recorded run shall keep each scenario's outcome, its steps, the location of its test and
    the requirements file as the file was at that run.
  rationale: >-
    The board and old runs have to agree with their tests. Keeping the requirements as they were
    puts every requirement change under the same history as the tests that verify the requirement,
    which is how the standard asks requirements to be managed: traced, with each change visible.
  type: functional
  verification: test
  standard: ISO/IEC/IEEE 29148:2018 §6.6.2

- id: history.partial-update
  statement: A run of part of the suite shall update only the scenarios that run touched.
  rationale: >-
    Running one test while fixing it should not wipe the rest of the board. Scenarios outside the
    run keep their last result.
  type: functional
  verification: test

- id: history.deletions
  statement: A full run shall remove from the board the scenarios whose tests were deleted.
  rationale: >-
    A board that keeps deleted tests shows work that no longer exists. Only a full run can tell
    deleted from unrun, so only a full run removes.
  type: functional
  verification: test

- id: history.compare
  statement: The viewer shall sort the scenarios of two runs into fixed, regressed, new and gone.
  rationale: >-
    The question after a change is what it fixed and what it broke. Comparing any two runs, not
    only adjacent ones, answers that across a branch.
  type: functional
  verification: test

- id: history.abandoned
  statement: A run whose pytest process stopped before finishing shall be marked abandoned.
  rationale: >-
    A run left as "running" forever makes the board lie and blocks the next comparison. A dead
    process is detected and named.
  type: software-attribute
  verification: test

- id: history.live-overlay
  statement: While a run is in progress, scenarios not reached yet shall show their last result, marked as queued.
  rationale: >-
    A board that blanks on each run loses the picture exactly when someone is watching the run.
    Last results, marked queued, keep the picture until the new ones arrive.
  type: usability
  verification: test

- id: history.prune
  statement: "`specdeck history prune` shall keep a configured number of runs per project and delete the older ones."
  rationale: >-
    Runs and results accumulate on every recorded run. Without a bound the history database grows
    until someone notices.
  type: functional
  verification: test

- id: history.forget
  statement: "`specdeck history forget` shall delete one project's recorded history."
  rationale: >-
    A project someone no longer works on should not stay in the viewer. Removing one project
    leaves the others untouched.
  type: functional
  verification: test

- id: watch.rerun-on-change
  statement: Watch mode shall rerun the suite when a source or test file changes, ignoring specdeck's own output.
  rationale: >-
    Re-running by hand breaks the loop of edit and check. Reacting to specdeck's own output would
    turn watch mode into an endless loop. Watch mode runs once at the start, then on each change.
  type: functional
  verification: test

- id: viewer.live
  statement: "`--specdeck-live` shall start the viewer when no viewer is running, or join the running viewer, and print the project's address."
  rationale: >-
    Seeing a run as it happens should take one flag. Several projects share one viewer, each on
    its own page.
  type: functional
  verification: test

- id: viewer.projects
  statement: The viewer shall list each project that recorded a run, with its own page and board.
  rationale: >-
    One viewer serves the developer's projects. Each project is reachable from the list.
  type: functional
  verification: test

- id: viewer.local-only
  statement: The viewer shall refuse a request whose Host is not loopback, and a write without the page's token.
  rationale: >-
    The viewer can edit and run code. Refusing foreign hosts stops DNS rebinding; requiring the
    page's token stops another site from posting to it.
  type: software-attribute
  verification: test

- id: viewer.runs-tests
  statement: The viewer shall start pytest for the project and update the board as results arrive.
  rationale: >-
    Fixing a failure and checking the fix should happen in one place. The board follows the run
    as the run streams.
  type: functional
  verification: test

- id: viewer.requirements-tab
  statement: The viewer shall show each requirement's verification status, its examples and the tests that verify the requirement.
  rationale: >-
    The requirements are the reason the tests exist. Showing them with their evidence makes the
    requirements, not the test list, the place to read the suite from.
  type: usability
  verification: test

- id: viewer.readable-at-scale
  statement: The viewer shall open on one node per feature, drawing one feature's scenarios on request.
  rationale: >-
    A graph of hundreds of scenarios at once is unreadable. Starting from features and opening one
    at a time keeps each view small enough to read.
  type: usability
  verification: test

- id: viewer.fix-loop
  statement: >-
    The viewer shall take a developer from a failing run to the root cause, a re-run and an edited
    step without leaving the browser.
  rationale: >-
    The viewer earns its place only if the whole loop — see what is stuck, fix, re-run, adjust the
    test — happens in one place.
  type: usability
  verification: test

# --- editing tests from the viewer -------------------------------------------------------------

- id: edit.in-place
  statement: >-
    The editor shall change a test's step text, expected labels, docstring, tags or dependencies by
    rewriting only the edited source text.
  rationale: >-
    A test edited from the browser has to stay a test someone would have written by hand: same
    quote style, same layout, the import added when a marker is added.
  type: functional
  verification: test

- id: edit.form
  statement: The editor shall show each editable field of a test and mark computed text as read-only.
  rationale: >-
    Step text built by code cannot be edited as text. Marking the step text read-only in the form
    tells the developer before an edit is refused, not after.
  type: usability
  verification: test

- id: edit.refuse-stale
  statement: The editor shall write nothing for an edit made to an outdated version of the test or to computed text.
  rationale: >-
    Writing over a test that changed since it was loaded would lose someone's work; editing text
    the code computes would edit something that is not in the file. Refusing writes nothing at all.
  type: software-attribute
  verification: test

- id: edit.review
  statement: The editor shall show the diff of an edit before writing the edit.
  rationale: >-
    Changing source code from a browser has to be reviewable first. The review writes nothing.
  type: usability
  verification: test

# --- specdeck's own rules: design constraints and the Definition of Done ------------------------

- id: constraint.dependencies
  statement: specdeck shall require only pytest and PyYAML to install.
  rationale: >-
    specdeck is added to other people's test suites. Each extra dependency is a version conflict
    waiting in someone else's environment. Optional features (coverage mapping) load their
    libraries when asked for.
  type: design-constraint
  verification: test

- id: process.self-check
  statement: A change to specdeck shall leave `specdeck validate` reporting no findings on specdeck's own spec and requirements.
  rationale: >-
    specdeck checks other projects against ISO/IEC/IEEE 29148:2018; its own requirements and tests
    are the first place that check has to pass. A finding left behind is a requirement that is
    unverified, ambiguous or untraced.
  type: process
  verification: demonstration

- id: process.generated-docs
  statement: SRS.md and the rules in AGENTS.md shall be regenerated from a full run before a change is committed.
  rationale: >-
    Both are generated, so they are only as current as the run they came from. A committed SRS
    that disagrees with the tests is the drift specdeck exists to prevent.
  type: process
  verification: inspection

- id: process.standard-text
  statement: The repository shall cite ISO/IEC/IEEE 29148:2018 by clause number, in specdeck's own words.
  rationale: >-
    The standard is copyrighted. Clause references let a reader with a copy check each claim,
    and the descriptions stay ours.
  type: process
  verification: inspection
